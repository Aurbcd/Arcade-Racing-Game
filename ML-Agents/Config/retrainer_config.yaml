behaviors:
  ArcadeCar:
    trainer_type: ppo
    hyperparameters:
        batch_size: 1024
        buffer_size: 10240
        learning_rate: 0.0003
        beta: 0.005
        epsilon: 0.2
        lambd: 0.95
        num_epoch: 3
        learning_rate_schedule: linear
    network_settings:
        normalize: true
        hidden_units: 512
        num_layers: 3
    reward_signals:
        extrinsic:
            strength: 1.0
            gamma: 0.995
    time_horizon: 128
    summary_freq: 5000
    threaded: false   
    max_steps: 2000000
    keep_checkpoints: 25
    checkpoint_interval: 100000

        
        
        
        
        
        
    

